<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="160" fill="#4F46E5" opacity="0.3" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#8B5CF6" opacity="0.25" filter="url(#glow)" />

  <!-- Grid accent lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand Logo Icon Container -->
  <rect x="100" y="90" width="88" height="88" rx="24" fill="url(#brandGrad)" />
  <path d="M144 114L165 158L144 150L123 158L144 114Z" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="3" stroke-linejoin="round" />
  <circle cx="144" cy="142" r="5" fill="#38BDF8" />

  <!-- Brand Name -->
  <text x="210" y="152" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">ProgressPilot</text>

  <!-- Tagline Badge -->
  <rect x="100" y="210" width="310" height="38" rx="19" fill="#312E81" stroke="#6366F1" stroke-width="1.5" />
  <text x="125" y="235" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#A5B4FC" letter-spacing="1">PERSONAL PRODUCTIVITY SUITE</text>

  <!-- Main Headline -->
  <text x="100" y="315" font-family="'Inter', -apple-system, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
    Plan Better. Focus Deeper.
  </text>
  <text x="100" y="380" font-family="'Inter', -apple-system, sans-serif" font-size="56" font-weight="900" fill="#818CF8" letter-spacing="-1.5">
    Progress Every Single Day.
  </text>

  <!-- Subheading -->
  <text x="100" y="440" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
    Smart task planner, Pomodoro focus tracker, recurring schedules, and real-time analytics.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 485)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="44" rx="22" fill="#1E293B" stroke="#334155" />
    <text x="90" y="27" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">⚡ Smart Tasks</text>

    <!-- Pill 2 -->
    <rect x="200" y="0" width="190" height="44" rx="22" fill="#1E293B" stroke="#334155" />
    <text x="295" y="27" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">⏱️ Pomodoro Timer</text>

    <!-- Pill 3 -->
    <rect x="410" y="0" width="190" height="44" rx="22" fill="#1E293B" stroke="#334155" />
    <text x="505" y="27" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">🎯 Goals & Habits</text>

    <!-- Pill 4 -->
    <rect x="620" y="0" width="180" height="44" rx="22" fill="#1E293B" stroke="#334155" />
    <text x="710" y="27" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">📊 Real-time Stats</text>
  </g>

  <!-- Live Domain Link Footer -->
  <text x="100" y="585" font-family="'Inter', monospace" font-size="16" font-weight="600" fill="#64748B">
    https://progresspilots.netlify.app
  </text>
</svg>
